<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANANTA — 15 stycznia 2027</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#05070b;color:#fff;font-family:Arial,Helvetica,sans-serif;
}
.bg{
  position:fixed;inset:0;overflow:hidden;background:#05070b;
}
.bg video{
  width:100%;height:100%;object-fit:cover;
  filter:brightness(.42) saturate(1.15);
  transform:scale(1.02);
}
.bg:after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.62)),
    linear-gradient(90deg,rgba(0,0,0,.42),transparent 55%,rgba(0,0,0,.28));
}
.content{
  position:relative;z-index:2;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}
.kicker{
  font-size:clamp(12px,1.5vw,18px);letter-spacing:8px;
  text-transform:uppercase;opacity:.85;margin-bottom:12px;
}
.logo{
  font-size:clamp(54px,11vw,150px);font-weight:800;
  letter-spacing:clamp(5px,1.2vw,18px);
  line-height:.9;text-shadow:0 0 30px rgba(80,190,255,.5);
}
.release{
  margin-top:22px;font-size:clamp(18px,2.4vw,34px);
  letter-spacing:5px;text-transform:uppercase;
}
.timer{
  margin-top:30px;display:flex;gap:clamp(8px,2vw,22px);
  align-items:stretch;
}
.box{
  min-width:clamp(78px,11vw,150px);
  padding:18px 14px 13px;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(5,8,14,.68);
  backdrop-filter:blur(8px);
  border-radius:10px;
  box-shadow:0 0 28px rgba(0,0,0,.35);
}
.num{
  font-size:clamp(32px,5vw,68px);font-weight:700;
  line-height:1;font-variant-numeric:tabular-nums;
}
.label{
  margin-top:8px;font-size:11px;letter-spacing:3px;
  text-transform:uppercase;opacity:.65;
}
.footer{
  position:absolute;bottom:22px;font-size:12px;
  letter-spacing:2px;opacity:.55;
}
@media(max-width:600px){
  .timer{gap:5px}.box{min-width:70px;padding:14px 7px 10px}
  .num{font-size:28px}.label{font-size:9px;letter-spacing:1px}
  .logo{letter-spacing:5px}
}
</style>
</head>
<body>
<div class="bg">
  <video autoplay muted loop playsinline preload="auto">
    <source src="https://www.anantagame.com/2025/0924/b09de7064df692f4abcf0b6483b41290.mp4" type="video/mp4">
  </video>
</div>

<main class="content">
  <div class="kicker">Global Release</div>
  <div class="logo">ANANTA</div>
  <div class="release">15 stycznia 2027</div>

  <div class="timer" aria-label="Odliczanie do premiery ANANTA">
    <div class="box"><div class="num" id="days">--</div><div class="label">dni</div></div>
    <div class="box"><div class="num" id="hours">--</div><div class="label">godzin</div></div>
    <div class="box"><div class="num" id="minutes">--</div><div class="label">minut</div></div>
    <div class="box"><div class="num" id="seconds">--</div><div class="label">sekund</div></div>
  </div>

  <div class="footer">NOVA CITY • 2027.01.15</div>
</main>

<script>
const target = new Date("2027-01-15T00:00:00+01:00").getTime();
const pad = n => String(n).padStart(2,"0");

function update(){
  let diff = Math.max(0, target - Date.now());
  let total = Math.floor(diff/1000);
  const d = Math.floor(total/86400); total %= 86400;
  const h = Math.floor(total/3600); total %= 3600;
  const m = Math.floor(total/60);
  const s = total % 60;

  document.getElementById("days").textContent = d;
  document.getElementById("hours").textContent = pad(h);
  document.getElementById("minutes").textContent = pad(m);
  document.getElementById("seconds").textContent = pad(s);
}
update();
setInterval(update,1000);
</script>
</body>
</html>
